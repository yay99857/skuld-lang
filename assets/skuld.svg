<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Skuld">
  <title>Skuld</title>
  <!-- Skuld is the norn of what is yet to come: an hourglass whose sand has
       gathered below, drawn as a rune so it stays legible at 16 pixels. -->
  <g fill="none" stroke="#8A7CF0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 10h32" />
    <path d="M16 54h32" />
    <path d="M19 12 32 32 19 52" />
    <path d="M45 12 32 32 45 52" />
  </g>
  <path d="M32 34 45 51H19Z" fill="#8A7CF0" />
</svg>
