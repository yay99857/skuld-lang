name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Edition 2024 needs a recent stable; the runner's rustup provides it.
      - name: Install the stable toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup component add rustfmt clippy

      # `run` and `trap` fixtures compile generated C, so clang is required
      # rather than optional: a missing clang must fail the suite, not skip it.
      - name: Report tool versions
        run: |
          rustc --version
          cargo --version
          clang --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The README tells readers these commands work; keep that honest. Two
      # examples are not plain demonstrations, and the loop says which:
      # `*_tests.skuld` holds `test_` functions and no entrypoint, so it is
      # `skuld test`'s to run, and `jsontool.skuld` is an application that
      # exits 2 when handed no file to read. A `run:` block executes under
      # `bash -e`, so either one ends the step and the job with it.
      - name: Run the documented examples
        run: |
          for example in examples/*.skuld; do
            echo "== $example"
            case "$example" in
              *_tests.skuld)
                cargo run --quiet -p skuld-cli -- test "$example" ;;
              */jsontool.skuld)
                cargo run --quiet -p skuld-cli -- run "$example" \
                  --args tests/bench/data/records.json --keys ;;
              *)
                cargo run --quiet -p skuld-cli -- run "$example" ;;
            esac
          done
