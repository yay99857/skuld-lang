name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # A failure on one system must not hide the other's result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - { os: ubuntu-latest, name: Linux }
          - { os: windows-latest, name: Windows }
    steps:
      - uses: actions/checkout@v4

      # Edition 2024 needs a recent stable; the runner's rustup provides it.
      - name: Install the stable toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup component add rustfmt clippy

      # The i686 portability suite builds every `tests/pass` fixture as a
      # 32-bit program and compares its output. It decides whether it can by
      # asking clang to build one, and until now the answer here was no — the
      # image carries no 32-bit libc — so the whole suite returned early and
      # the claim that it runs every fixture on i686 was checked by nothing.
      - name: Install a 32-bit libc for the portability suite
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib libc6-dev-i386

      # `run` and `trap` fixtures compile generated C, so clang is required
      # rather than optional: a missing clang must fail the suite, not skip it.
      # Both runner images ship one; this reports which, and fails here rather
      # than inside a test if an image ever stops.
      - name: Report tool versions
        run: |
          rustc --version
          cargo --version
          clang --version

      # M28: `std/tls` has never executed on Windows, and the first thing the
      # milestone needs to know is what there is to link against. The runner
      # image lists OpenSSL under Tools and says nothing about headers or
      # import libraries, which is not the same as saying it has none. So this
      # reports instead of assuming, and it cannot fail the job: guessing twice
      # at an opaque Windows failure has already cost this project two rounds
      # of CI, and the rule written afterwards was to make the run say what it
      # found.
      - name: Report what OpenSSL is available here
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          echo "== openssl on PATH"
          command -v openssl || echo "   (not on PATH)"
          openssl version -a || true
          echo "== install roots worth checking"
          for root in "/c/Program Files/OpenSSL" "/c/Program Files/OpenSSL-Win64" "/c/Program Files/Git/mingw64" "/c/Strawberry/c" "/c/vcpkg/installed/x64-windows"; do
            if [ ! -d "$root" ]; then
              echo "-- $root (absent)"
              continue
            fi
            echo "-- $root"
            # Deep rather than shallow, because a Windows OpenSSL does not
            # put its import libraries where a Unix one does: the installer
            # for `C:\Program Files\OpenSSL` files them under `lib\VC\<arch>`
            # by runtime, and a first pass here looked only at `lib/*` and so
            # reported none where there may be several.
            found=$(find "$root" -maxdepth 5 \( -iname '*ssl*.lib' -o -iname '*crypto*.lib' -o -iname 'libssl.a' -o -iname 'libcrypto.a' \) 2>/dev/null || true)
            if [ -n "$found" ]; then
              echo "$found" | sed 's/^/   /'
            else
              echo "   no import or static libraries under it"
            fi
            if [ -f "$root/include/openssl/ssl.h" ]; then
              echo "   headers: $root/include/openssl/ssl.h"
            else
              echo "   no headers"
            fi
          done
          echo "== what this clang makes of -lssl"
          echo 'int main(void){return 0;}' > openssl-probe.c
          clang -### openssl-probe.c -o openssl-probe.exe -lssl 2>&1 | tr ' ' '\n' | grep -i ssl || true
          rm -f openssl-probe.c
          echo "== the target this clang defaults to"
          clang -print-target-triple || true

      # Formatting is the same question on every system, so asking twice only
      # buys a second way to fail.
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      # Linting is not: `cfg` decides what exists, so each system lints code
      # the other never compiles. With `-D warnings` a constant used only by a
      # gated test is an error, and that is worth catching on both.
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # A skipped test reports `ok`, so a green suite is not by itself evidence
      # that anything ran. The TLS suite is the one that matters here, because
      # it is the only place `std/tls` is exercised at all and it skips itself
      # when it cannot find an OpenSSL to link against — which on Windows
      # depends on the runner image carrying a development install.
      #
      # M28 established that the suite runs there by reading a job log once.
      # That is an observation, not a gate: the day an image stops shipping
      # that install, Windows TLS coverage would fall to zero and this workflow
      # would stay green. That is precisely the failure this project already
      # paid for once — a milestone recorded as met while the tests were green
      # because the failing one was gated. So it is asserted rather than
      # assumed, on both systems, since the same thing can happen on either.
      # The same reasoning as the step below, for the same reason: this suite
      # also reports `ok` when it has run nothing, and it is the only thing
      # standing behind "every pass fixture runs identically on i686". It is
      # Linux-only by design — the target it names is i686-linux-gnu — so it is
      # asserted only there rather than pretended at everywhere.
      - name: Fail if the portability suite skipped itself
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          output=$(cargo test -p skuld-cli --test portability -- --nocapture 2>&1)
          echo "$output"
          if echo "$output" | grep -q "skipping:"; then
            echo "::error::the i686 suite skipped, so no fixture was checked on a 32-bit target"
            exit 1
          fi

      - name: Fail if the TLS suite skipped itself
        shell: bash
        run: |
          output=$(cargo test -p skuld-cli --test https -- --nocapture 2>&1)
          echo "$output"
          if echo "$output" | grep -q "skipping:"; then
            echo "::error::the HTTPS suite skipped, so TLS is not being tested here"
            exit 1
          fi

      # The README tells readers these commands work; keep that honest. Three
      # examples are not plain demonstrations, and the loop says which:
      # `*_tests.skuld` holds `test_` functions and no entrypoint, so it is
      # `skuld test`'s to run; `jsontool.skuld` is an application that exits 2
      # when handed no file to read; and `barmodule.skuld` reads `/proc` and
      # runs `uname`, so it demonstrates reading a Linux machine's state and is
      # not meant to be portable. A `run:` block executes under `bash -e`, so
      # any of them ends the step and the job with it.
      - name: Run the documented examples
        shell: bash
        run: |
          for example in examples/*.skuld; do
            case "$example" in
              */barmodule.skuld)
                if [ "$RUNNER_OS" = "Windows" ]; then
                  echo "== $example (skipped: reads /proc and runs uname)"
                  continue
                fi ;;
            esac
            echo "== $example"
            case "$example" in
              *_tests.skuld)
                cargo run --quiet -p skuld-cli -- test "$example" ;;
              */jsontool.skuld)
                cargo run --quiet -p skuld-cli -- run "$example" \
                  --args tests/bench/data/records.json --keys ;;
              *)
                cargo run --quiet -p skuld-cli -- run "$example" ;;
            esac
          done
